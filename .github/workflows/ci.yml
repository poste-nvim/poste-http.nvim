name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua + LuaRocks
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      # Zero-warning baseline (2026-09-14): any luacheck warning or error
      # fails the build.
      - name: Lint
        run: luacheck --codes lua plugin ftplugin tests after queries

  test:
    # The bundled parsers are tree-sitter ABI 14, which Neovim 0.11 is the
    # first release to load; ts_query relies on the 0.11 iter_matches node
    # lists. So 0.11 is the floor (README says the same), and CI verifies
    # current stable + nightly rather than a stale pinned floor.
    # macOS is in the matrix because the maintainer develops on macOS: a
    # GNU-coreutils-only `timeout` in tests/injection_spec.sh kept the whole
    # suite red on macOS while ubuntu-only CI stayed green (2026-10-24).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim_version: [stable, nightly]
    # nightly is a signal, not the gate: the dev build moves daily and an
    # unrelated nvim regression must not turn the badge red. stable is the
    # release-quality floor.
    continue-on-error: ${{ matrix.nvim_version == 'nightly' }}
    name: Test (${{ matrix.os }}, ${{ matrix.nvim_version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # tree-sitter/setup-action@v1 breaks on current CLI releases: its config
      # step misparses `tree-sitter init-config` output (empty $config path ->
      # exit 1, seen 2026-10-16). The grammar specs only need the CLI on PATH
      # for `generate`/`parse`, so install the released binary directly.
      # v0.26.x matches the CLI used locally; `generate` output is stable
      # within a minor series. Asset name differs by OS/arch (macos-latest is
      # arm64).
      - name: Install tree-sitter CLI
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)  asset="tree-sitter-linux-x64.gz" ;;
            macOS-ARM64) asset="tree-sitter-macos-arm64.gz" ;;
            macOS-X64)  asset="tree-sitter-macos-x64.gz" ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          curl -sSLf "https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.13/$asset" \
            | gunzip > tree-sitter-cli
          sudo install -m 0755 tree-sitter-cli /usr/local/bin/tree-sitter
          tree-sitter --version

      - name: Install Neovim ${{ matrix.nvim_version }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}

      - name: Check out plenary.nvim
        run: |
          mkdir -p ~/.local/share/nvim/lazy
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/lazy/plenary.nvim

      # timeout-minutes is the native (portable) replacement for the GNU
      # `timeout 600` prefix, which does not exist on macOS runners.
      - name: Run tests
        timeout-minutes: 20
        run: ./tests/run.sh ~/.local/share/nvim/lazy/plenary.nvim
