name: Bug report
description: Something is not working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Before submitting:

        1. Run `:checkhealth poste-http` in Neovim — it catches the most common
           breakages (curl missing, stale or missing tree-sitter parsers,
           missing C compiler, missing grpcurl/websocat backends).
        2. If the parser is reported stale or missing, run
           `:PosteHttpBuildParsers`, restart Neovim, and re-run checkhealth
           before filing — that fixes a large share of "highlights look wrong"
           and "body misparsed" reports.
        3. Skim [SUPPORT.md](../SUPPORT.md) — it covers the diagnosis
           path for parser, backend, and environment-variable problems.

        Paste the full checkhealth output below. Reports without it will be
        asked to provide it before triage.

  - type: textarea
    id: checkhealth
    attributes:
      label: ":checkhealth poste-http output"
      description: "Run `:checkhealth poste-http` and paste the full output. Run `:redir @+ | checkhealth poste-http | redir END` to copy it to the clipboard."
      render: plain
    validations:
      required: true

  - type: input
    id: nvim-version
    attributes:
      label: "Neovim version"
      description: "Output of `nvim --version | head -1`"
      placeholder: "NVIM v0.10.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating system"
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (aarch64)
        - Windows (x86_64)
        - Other / WSL
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: "Request protocol involved"
      options:
        - HTTP (plain request)
        - GRAPHQL
        - GRPC
        - WEBSOCKET
        - Not request-specific (completion, import, history, UI…)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "A clear description of the unexpected behaviour. Include the exact key sequence or `:` command that triggered it."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Minimal reproduction"
      description: |
        The smallest `.http` file (plus the relevant `env.json` snippet, with
        secrets replaced by placeholders) that reproduces the issue. A file
        that runs against the `playground/http/server` docker test server is
        ideal — it lets us verify without guessing your backend.
      render: http
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I have run `:checkhealth poste-http` and pasted the output above"
          required: true
        - label: "I have run `:PosteHttpBuildParsers` and restarted Neovim (if the parser was stale or missing)"
          required: false
        - label: "I have checked existing issues for duplicates"
          required: true
        - label: "I am on the latest `main` (or have noted my commit below)"
          required: true
