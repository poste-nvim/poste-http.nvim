# Issue template config — routes reporters to self-diagnosis first.
# Blank issues are disabled: every report goes through a template so the
# triage-critical info (checkhealth output) arrives with the issue,
# not after a round-trip asking for it.

blank_issues_enabled: false
contact_links:
  - name: Troubleshooting guide
    url: https://github.com/poste-nvim/poste-http.nvim/blob/main/SUPPORT.md
    about: "Parser errors? GRPC/WEBSOCKET requests failing? Variables not resolving? Read this before opening an issue — it covers the diagnosis path."
  - name: Testing guide
    url: https://github.com/poste-nvim/poste-http.nvim/blob/main/docs/dev/testing.md
    about: "Want to contribute a fix? Start here — how to run the grammar, injection, and Lua test layers locally."
  - name: Discussions
    url: https://github.com/poste-nvim/poste-http.nvim/discussions
    about: "Questions, usage tips, and config sharing go in Discussions, not Issues."
