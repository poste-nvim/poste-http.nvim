name: Feature request
description: Suggest a new feature, protocol capability, or behaviour
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "The use case, not the solution. What are you trying to do that the plugin currently makes hard or impossible?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution"
      description: "What you'd like the plugin to do instead. A key sequence, a directive, a response-view behaviour — be specific."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area affected (if any)"
      options:
        - Request execution (HTTP)
        - GRAPHQL
        - GRPC
        - WEBSOCKET
        - Environment variables / env.json
        - Import (OpenAPI / Swagger / Postman)
        - Response view (jq, tabs, assertions)
        - Completion
        - AI chat integration
        - Other / not sure
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I have checked existing issues (open and closed) for duplicates"
          required: true
        - label: "I have read the relevant section of `:h poste-http`"
          required: true
